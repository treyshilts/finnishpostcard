<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Finnish Postcard</title>

  <style>
    body {
      margin: 0;
      font-family: "Times New Roman", Times, serif;
      height: 100vh;
      overflow: hidden;
      background-color: white;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-top: 80px;
      color: black;
    }

    h1 {
      font-style: italic;
      font-weight: normal;
      margin-bottom: 20px;
    }

    .top-images {
      width: 600px;
      margin: 0 auto 10px auto;
    
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    
    .logo-image {
      width: 100px;
      height: auto;
      display: block;
    }
    
    .email-image {
      width: 100px;
      height: auto;
      display: block;
    }
    
    .sky-image {
      display: block;
      width: 600px;
      height: auto;
      margin-left: auto;
      margin-right: auto;
    }
    
    .lemon-image {
      display: block;
      width: 350px;
      height: auto;
      margin-left: auto;
      margin-right: auto;
    }
    
    .sky-image {
      margin-bottom: 30px;
    }
    
    .lemon-image {
      margin-top: 30px;
    }
    
    .links a {
      text-decoration: none;
      color: black;
      margin: 0 8px;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1><i>Finnish Postcard</i></h1>

    <div class="top-images">
      <img class="logo-image" src="FP-LOGO.webp" alt="Finnish Postcard logo">
    
      <a href="mailto:contact@finnishpostcard.com">
        <img class="email-image" src="emailgif2.gif" alt="Email Finnish Postcard">
      </a>
    </div>
    
    <img class="sky-image" src="Sky.png" alt="">
    
    <div class="links">
      <a href="#">music</a> 
      ...
      <a href="#">shows</a> 
      ...
      <a href="#">shop</a> 
      ...
      <a href="#">words</a> 
      ...
      <a href="#">bedroom</a>
    </div>

    <img class="lemon-image" src="FP+lemontree.webp" alt="">
    
  </div>

</body>
</html>
