<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Finnish Postcard</title>

  <style>
    body {
      margin: 0;
      font-family: "Times New Roman", Times, serif;
      height: 100vh;
      overflow: hidden;
      background-color: white;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-top: 80px;
      color: black;
    }

    h1 {
      font-style: italic;
      font-weight: normal;
      margin-bottom: 20px;
    }

    .sky-image,
    .lemon-image {
      display: block;
      width: 50%;
      height: auto;
      margin-left: auto;
      margin-right: auto;
    }
    
    .sky-image {
      margin-bottom: 30px;
    }
    
    .lemon-image {
      margin-top: 30px;
    }
    
    .links a {
      text-decoration: none;
      color: black;
      margin: 0 8px;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1><i>Finnish Postcard</i></h1>

    <img class="sky-image" src="Sky.png" alt="">
    
    <div class="links">
      <a href="#">music</a> 
      <a href="#">shows</a> 
      <a href="#">shop</a> 
      <a href="#">words</a> 
      <a href="#">bedroom</a>
    </div>

    <img class="lemon-image" src="FP+lemontree.webp" alt="">
    
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      5000
    );

    camera.position.set(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById("sky-bg").appendChild(renderer.domElement);

    const textureLoader = new THREE.TextureLoader();

    textureLoader.load("Sky.png", (texture) => {
      texture.colorSpace = THREE.SRGBColorSpace;

      // MUCH bigger sphere
      const geometry = new THREE.SphereGeometry(2000, 64, 64);

      const material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.BackSide
      });

      const sphere = new THREE.Mesh(geometry, material);

      // stronger stretch
      sphere.scale.set(2.2, 1, 1);

      scene.add(sphere);

      function animate() {
        requestAnimationFrame(animate);

        sphere.rotation.y += 0.001

        renderer.render(scene, camera);
      }

      animate();
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
