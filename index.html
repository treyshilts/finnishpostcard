<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Finnish Postcard</title>

  <style>
    body {
      margin: 0;
      font-family: "Times New Roman", Times, serif;
      height: 100vh;
      overflow: hidden;
      background: black;
    }

    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-top: 80px;
      color: white;
    }

    h1 {
      font-style: italic;
      font-weight: normal;
      margin-bottom: 20px;
    }

    .links a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div id="bg"></div>

  <div class="container">
    <h1>Finnish Postcard</h1>
    <div class="links">
      <a href="#">music</a> |
      <a href="#">shows</a> |
      <a href="#">shop</a> |
      <a href="#">words</a> |
      <a href="#">bedroom</a>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      5000
    );

    camera.position.set(0, 0, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById("bg").appendChild(renderer.domElement);

    const loader = new THREE.TextureLoader();

    const SKY_SPEED = 0.0008;
    const WATER_SPEED = 0.0012;

    // Change this to control water tile size.
    // Smaller numbers = bigger tiles.
    // Bigger numbers = smaller/more repeated tiles.
    const WATER_TILE_REPEAT_X = 8;
    const WATER_TILE_REPEAT_Y = 30;

    loader.load("Sky.png", (skyTexture) => {
      loader.load("water.png", (waterTexture) => {
        skyTexture.colorSpace = THREE.SRGBColorSpace;
        waterTexture.colorSpace = THREE.SRGBColorSpace;

        skyTexture.wrapS = THREE.RepeatWrapping;
        skyTexture.wrapT = THREE.RepeatWrapping;
        skyTexture.repeat.set(1, 1);

        waterTexture.wrapS = THREE.RepeatWrapping;
        waterTexture.wrapT = THREE.RepeatWrapping;
        waterTexture.repeat.set(WATER_TILE_REPEAT_X, WATER_TILE_REPEAT_Y);

        const skyGeometry = new THREE.PlaneGeometry(200, 200);
        const waterGeometry = new THREE.PlaneGeometry(200, 200);

        const skyMaterial = new THREE.MeshBasicMaterial({
          map: skyTexture,
          side: THREE.DoubleSide
        });

        const waterMaterial = new THREE.MeshBasicMaterial({
          map: waterTexture,
          side: THREE.DoubleSide
        });

        const sky = new THREE.Mesh(skyGeometry, skyMaterial);
        const water = new THREE.Mesh(waterGeometry, waterMaterial);

        sky.position.set(0, 8, -30);
        sky.rotation.x = -1.1;
        
        water.position.set(0, -8, -30);
        water.rotation.x = 1.1;

        scene.add(sky);
        scene.add(water);

        function animate() {
          requestAnimationFrame(animate);

          // Makes both textures appear to move toward the viewer
          skyTexture.offset.y -= SKY_SPEED;
          waterTexture.offset.y -= WATER_SPEED;

          renderer.render(scene, camera);
        }

        animate();
      });
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
