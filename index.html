<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Finnish Postcard</title>

  <style>
    body {
      margin: 0;
      font-family: "Times New Roman", Times, serif;
      height: 100vh;
      overflow: hidden;
      background-color: black;
    }

    #sky-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-top: 80px;
      color: white;
    }

    h1 {
      font-style: italic;
      font-weight: normal;
      margin-bottom: 20px;
      text-shadow: 0 0 8px black;
    }

    .links a {
      text-decoration: none;
      color: white;
      margin: 0 8px;
      text-shadow: 0 0 8px black;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div id="sky-bg"></div>

  <div class="container">
    <h1>Finnish Postcard</h1>
    <div class="links">
      <a href="#">music</a> |
      <a href="#">shows</a> |
      <a href="#">shop</a> |
      <a href="#">words</a> |
      <a href="#">bedroom</a>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById("sky-bg").appendChild(renderer.domElement);

    const textureLoader = new THREE.TextureLoader();

    textureLoader.load("Sky.png", (texture) => {
      texture.colorSpace = THREE.SRGBColorSpace;

      const geometry = new THREE.SphereGeometry(500, 64, 64);

      const material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.BackSide
      });

      const sphere = new THREE.Mesh(geometry, material);

      sphere.scale.set(1.6, 1, 1); // stretches the sky image horizontally

      scene.add(sphere);

      function animate() {
        requestAnimationFrame(animate);

        sphere.rotation.y += 0.0008; // slow left/right rotation

        renderer.render(scene, camera);
      }

      animate();
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
