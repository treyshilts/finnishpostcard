<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Finnish Postcard</title>
  <style>
    body {
      margin: 0;
      font-family: "Times New Roman", Times, serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      background-color: white;
    }

    .container {
      text-align: center;
      margin-top: 80px;
    }

    h1 {
      font-style: italic;
      font-weight: normal;
      margin-bottom: 20px;
    }

    .links a {
      text-decoration: none;
      color: black;
      margin: 0 8px;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Finnish Postcard</h1>
    <div class="links">
      <a href="#">music</a> |
      <a href="#">shows</a> |
      <a href="#">shop</a> |
      <a href="#">words</a> |
      <a href="#">bedroom</a>
    </div>
  </div>
</body>
</html>
