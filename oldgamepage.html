<!-- Link to your external CSS file -->
<link rel="stylesheet" href="https://treyshilts.github.io/3d-vibes/styles.css">

<div id="new-game-container" class="view active" style="
  position: relative;
  margin-top: 20px;
  display: block;">

<div style="
  text-align: center;
  font-size: 16px;
  color: black;
  margin-top: 20px;">
  <i> (you can use arrow keys if you have them) </i>
</div>

<div id="new-game-container" class="view active" style="position: relative;">
  <canvas id="threejs-scene"></canvas>
  <div id="score-display" style="z-index: 0;">Score: <span id="score">0</span></div>
  <!-- Position display -->
<div id="position-display" style="
    position: absolute;
    top: 100%;
    left: 100%;
    color: black;
    font-size: 0px;
    z-index: 1;">
  Position: <span id="position">0</span>
</div>
  <div id="controls">
    <div id="vertical-controls">
      <button id="move-backward">⬆</button>
      <button id="move-forward">⬇</button>
    </div>
    <div id="horizontal-controls">
      <button id="turn-left">⬅</button>
      <button id="turn-right">➡</button>
    </div>
  </div>

  <div id="black-overlay" style="
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: black;
    z-index: 9999;">
</div>

<div id="full-screen-image" style="
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('https://treyshilts.github.io/3d-vibes/FP_firstscreen_2.png') center/cover no-repeat;
  z-index: 9998;">
</div>

  <!-- Splashscreen -->
  <div id="intro-background" style="
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://treyshilts.github.io/3d-vibes/title_screen.png') center/cover no-repeat;
      z-index: 999;"></div>

  <!-- Title and subtitle -->
  <div id="intro-text" style="
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 1000;">
    <h1 style="margin: 0; font-size: 24px; color: black;"></h1>
    <p style="margin: 5px 0 18px; font-size: 14px; color: black;"></p>
  </div>
<div id="collisionDialog" style="
  position: absolute;
  position: fixed;
  color: black; /* <-- add this line */
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: white;
  padding: 16px;
  display: none;
  z-index: 1000;
">
  <p>you have found the secret FP disc.<br>what would you like to do now?</p>
  <button onclick="downloadAction()">download</button>
  <button onclick="closeDialog()">restart game</button>
</div>

<div id="dialogBackdrop" style="
  position: fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background-color: rgba(0,0,0,0.5);
  display: none;
  z-index: 999;
"></div>

  <!-- Play button -->
  <button id="play-button" style="
      position: absolute;
      top: 55%;
      left: 20%;
      transform: translate(-50%, -50%);
      padding: 10px 20px;
      font-size: 16px;
      z-index: 1000;">Play</button>
</div>

<!-- Include Three.js and loaders from CDNs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/110/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.110.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.110.0/examples/js/loaders/MTLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.110.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- Include your external game.js file -->
<script src="https://treyshilts.github.io/3d-vibes/game.js"></script>
